# Database Connection Settings (Example for MySQL, adjust for your DB)
#spring.datasource.url=jdbc:sqlserver://splitzee-server.database.windows.net:1433;database=splitzee05;user=sql05@splitzee-server;password=${DB_PASSWORD:};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.url=jdbc:mysql://localhost:3306/split
#spring.datasource.username=sql05
spring.datasource.username=root

#spring.datasource.password=${DB_PASSWORD:}
spring.datasource.password=SQL2005
#spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.connection-timeout=90000
logging.pattern.console = ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger(15)) - %cyan(%msg%n)}

#spring.security.user.name=admin
#spring.security.user.password=admin
#spring.security.user.roles=USER,ADMIN

resend.api.key=${RESEND_API_KEY:}

# Frontend URL configuration
frontend.url=${FRONTEND_URL:http://localhost:3000}

